# trop2_cis-dimer_inhibitor - conda environment (Python 3.11)
# Usage:
#   conda env create -f environment.yml && conda activate trop2-cis-dimer-inhibitor
#   pip install -e .
name: trop2-cis-dimer-inhibitor
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --editable .
      - pydantic==2.13.4
      - typer==0.27.1
      - gemmi==0.7.5
      - biopython==1.88
      - numpy==2.2.6
      - pandas==2.3.3
      - scipy==1.17.1
      - PyYAML==6.0.3
      - Jinja2==3.1.6
      - matplotlib==3.11.1
      - tqdm==4.70.0
