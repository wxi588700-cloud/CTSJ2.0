# External algorithm locations (M00 tool registry).
# Copy previously downloaded checkouts into ./external (git-ignored) with
#   scripts/setup_external_tools.sh /path/to/downloaded/checkouts
# or point the paths directly at existing checkouts.
#
# GPU predictor (Boltz-2): python = interpreter of the boltz conda env.
# On this cluster the GPU node gn1 shares the home directory over NFS, so
# runs launched on the CPU management node are dispatched via SSH while
# inputs/outputs remain directly visible on both sides.  Remove the
# ssh_host note when running ON the GPU node itself.
#
# LICENSE note (PRD NFR): RFdiffusion + ProteinMPNN weights are for
# non-commercial research; record and re-review before any commercial use.

rfdiffusion:
  root: external/RFdiffusion
  # RFdiffusion deps installed into the boltz env (dgl==1.1.3, vendored
  # SE3Transformer --no-deps, e3nn, pyrsistent; rfdiffusion itself -e)
  python: ~/miniconda3/envs/boltz/bin/python
  # deps installed into the boltz env: dgl==2.1.0+cu121 (conda dglteam/label/
  # cu121, numpy<2 pin) + torchdata==0.7.1 + pydantic + vendored
  # SE3Transformer (--no-deps) + e3nn + pyrsistent + rfdiffusion (-e)
  ssh_host: gn1   # inference on GPU node via shared home (~3min/design on GPU6)
  weights: external/RFdiffusion/models/Complex_base_ckpt.pt
  license: RFdiffusion (BSD-like, non-commercial weights)
  version: local-checkout

proteinmpnn:
  root: external/ProteinMPNN
  # the boltz env already ships a CUDA torch; ProteinMPNN runs fine with it
  python: ~/miniconda3/envs/boltz/bin/python
  weights: external/ProteinMPNN/vanilla_model_weights/vanilla_weights_state_dict.pt
  license: "MIT (weights: non-commercial research)"
  version: local-checkout

foldseek: null        # set {root: ..., license: GPL-3} when installed
mmseqs2: null
netmhc2pan: null      # academic licence; adapter + review fallback otherwise

predictors:
  # primary complex predictor - first available wins:
  boltz:
    kind: boltz
    python: ~/miniconda3/envs/boltz/bin/python
    weights: ~/.boltz
    license: Boltz source-available (weights on server, non-commercial research)
    version: "2.0.3 (torch 2.5.1+cu121)"
    notes: ssh_host=gn1 ; empty-MSA offline mode; seed from resources.seed
    # device: 6            # 固定使用 6 号 GPU（CUDA_VISIBLE_DEVICES）
    #                       # 注释掉 = 自动选择空闲显存最大的卡；
    #                       # 临时指定也可用环境变量: TROP2_BOLTZ_DEVICE=6 bash run.sh
  af2_multimer:
    kind: af2_multimer
    weights: null
    license: AlphaFold license (non-commercial)
    notes: local colabfold_batch / AF2-Multimer on GPU hosts (not installed)
