        occupancy: 1.0
        iupac: Gal(b1-4)GlcNAc(b1-2)Man(a1-6)[Gal(b1-4)GlcNAc(b1-2)Man(a1-3)]Man(b1-4)GlcNAc(b1-4)GlcNAc
        residues: &bi_tree
          - {ccd: NAG, parent: -1}
          - {ccd: NAG, parent: 0, parent_atom: O4}
          - {ccd: BMA, parent: 1, parent_atom: O4}
          - {ccd: MAN, parent: 2, parent_atom: O3}     # 1-3 antenna
          - {ccd: MAN, parent: 2, parent_atom: O6}     # 1-6 antenna
          - {ccd: NAG, parent: 3, parent_atom: O2}
          - {ccd: NAG, parent: 4, parent_atom: O2}
          - {ccd: GAL, parent: 5, parent_atom: O4}
          - {ccd: GAL, parent: 6, parent_atom: O4}
      "120":
        site: 120
        occupancy: 1.0
        iupac: Gal(b1-4)GlcNAc(b1-2)Man(a1-6)[Gal(b1-4)GlcNAc(b1-2)Man(a1-3)]Man(b1-4)GlcNAc(b1-4)GlcNAc
        residues: *bi_tree
      "168":
        site: 168
        occupancy: 1.0
        iupac: Gal(b1-4)GlcNAc(b1-2)Man(a1-6)[Gal(b1-4)GlcNAc(b1-2)Man(a1-3)]Man(b1-4)GlcNAc(b1-4)GlcNAc
        residues: *bi_tree
      "208":
        site: 208
        occupancy: 1.0
        iupac: Gal(b1-4)GlcNAc(b1-2)Man(a1-6)[Gal(b1-4)GlcNAc(b1-2)Man(a1-3)]Man(b1-4)GlcNAc(b1-4)GlcNAc
        residues: *bi_tree

