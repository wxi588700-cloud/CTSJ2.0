[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trop2_cis-dimer_inhibitor"
version = "1.0.1"
description = "TROP2 cleaved-state (R87-T88) specific miniprotein binder design and multi-objective evaluation platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - research use only" }
authors = [{ name = "TROP2 binder platform team" }]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "gemmi>=0.6.6",
    "biopython>=1.83",
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<3",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
trop2 = "trop2_design.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running integration tests"]

[tool.coverage.run]
source = ["src/trop2_design"]
