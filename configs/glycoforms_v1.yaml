# ============================================================================
# TROP2 N-糖型注册表（PRD v1.1 M02.3）
#
# 糖型组成是版本化输入：本文件声明每个 N-糖位点的糖链组成
# （IUPAC-condensed + CCD 残基树）、占有率与证据等级。算法不从序列
# 推断糖型——无位点特异性糖蛋白组学（LC-MS/MS）数据时，三个面板均
# 为敏感性分析假设（evidence_level: assumed_sensitivity_panel）。
#
# 位点实证依据：P09758 序列 N-X-S/T motif 仅出现在 33/120/168/208
# （脚本核查于 2026-08-17），且四个残基在 7E5N 链A 中全部解析。
# CCD 残基：NAG=GlcNAc, BMA=β-Man, MAN=α-Man, GAL=Gal, FUC=Fuc, SIA=Neu5Ac
# 残基树：根（parent=-1）接 Asn ND2；后续残基按 parent 索引连接。
# ==========================================================================
registry_id: glycoforms_trop2
version: "1"
n_sites_expected: 4

profiles:
  # ------------------------------------------------------------------
  # 面板 1：高甘露糖 Man5GlcNAc2
  # ------------------------------------------------------------------
  - profile_id: high_mannose_man5
    description: Man5GlcNAc2 高甘露糖型（昆虫/未完全加工糖型，接近 7E5N 表达背景）
    evidence_level: assumed_sensitivity_panel
    sites:
      "33":
        site: 33
        occupancy: 1.0
        iupac: Man(a1-3)[Man(a1-3)(Man(a1-6))Man(a1-6)]Man(b1-4)GlcNAc(b1-4)GlcNAc
        residues:
          - {ccd: NAG, parent: -1}                      # GlcNAc-1: Asn ND2
          - {ccd: NAG, parent: 0, parent_atom: O4}      # GlcNAc-2
          - {ccd: BMA, parent: 1, parent_atom: O4}      # beta-Man core
          - {ccd: MAN, parent: 2, parent_atom: O3}      # alpha-Man 1-3 arm
          - {ccd: MAN, parent: 2, parent_atom: O6}      # alpha-Man 1-6 arm
          - {ccd: MAN, parent: 4, parent_atom: O3}      # extra Man on 1-6 arm
          - {ccd: MAN, parent: 4, parent_atom: O6}      # extra Man on 1-6 arm
      "120":
        site: 120
        occupancy: 1.0
        iupac: Man(a1-3)[Man(a1-3)(Man(a1-6))Man(a1-6)]Man(b1-4)GlcNAc(b1-4)GlcNAc
        residues: &man5_tree
          - {ccd: NAG, parent: -1}
          - {ccd: NAG, parent: 0, parent_atom: O4}
          - {ccd: BMA, parent: 1, parent_atom: O4}
          - {ccd: MAN, parent: 2, parent_atom: O3}
          - {ccd: MAN, parent: 2, parent_atom: O6}
          - {ccd: MAN, parent: 4, parent_atom: O3}
          - {ccd: MAN, parent: 4, parent_atom: O6}
      "168":
        site: 168
        occupancy: 1.0
        iupac: Man(a1-3)[Man(a1-3)(Man(a1-6))Man(a1-6)]Man(b1-4)GlcNAc(b1-4)GlcNAc
        residues: *man5_tree
      "208":
        site: 208
        occupancy: 1.0
        iupac: Man(a1-3)[Man(a1-3)(Man(a1-6))Man(a1-6)]Man(b1-4)GlcNAc(b1-4)GlcNAc
        residues: *man5_tree

  # ------------------------------------------------------------------
  # 面板 2：复杂二天线（哺乳动物加工，HEK293/CHO 常见）
  # ------------------------------------------------------------------
  - profile_id: complex_biantennary
    description: Gal2GlcNAc2Man3GlcNAc2 复杂二天线型（HEK293/CHO 表达典型糖型）
    evidence_level: assumed_sensitivity_panel
    sites:
      "33":
